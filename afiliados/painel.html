<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Afiliados CVC</title>
<style>
  :root {
    --tinta: #111827; --suave: #4b5563; --fraco: #9ca3af; --linha: #e5e7eb;
    --fundo: #f6f7f9; --cartao: #ffffff; --azul: #2563eb;
    --bom: #15803d; --bom-f: #dcfce7; --ruim: #b91c1c; --ruim-f: #fee2e2;
    --alerta: #92400e; --alerta-f: #fef3c7; --barra: #e5e7eb;
    /* cores das marcas: as mesmas do addon Metabuscadores */
    --cvc: #ffe000; --cvc-tinta: #0b2a6f; --rival: #4b00d1; --rival-tinta: #ffffff;
    --tiffany: #81d8d0; --tiffany-tinta: #08312e; --maxmilhas: #22a45d; --maxmilhas-tinta: #ffffff;
    --milhas123: #1d1b5e; --milhas123-tinta: #ffffff; --gol: #ff7020; --gol-tinta: #ffffff;
    --latam: #e8114b; --latam-tinta: #ffffff; --azulcia: #00349a; --azulcia-tinta: #ffffff; --outra: #9ca3af;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --tinta: #f3f4f6; --suave: #c4c9d2; --fraco: #8b93a1; --linha: #2d333d;
      --fundo: #14171c; --cartao: #1c2027;
      --bom: #4ade80; --bom-f: #14301f; --ruim: #f87171; --ruim-f: #3a1717;
      --alerta: #fcd34d; --alerta-f: #3a2e12; --barra: #2d333d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px 14px 24px; background: var(--fundo); color: var(--tinta);
         font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .topo { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .topo img { width: 22px; height: 22px; }
  .topo b { font-size: 14px; flex: 1; }
  .chip { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; color: #fff; background: #e4002b; }
  .pagina { font-size: 16px; font-weight: 700; line-height: 1.3; }
  .meta { color: var(--suave); margin-top: 2px; font-size: 12px; }
  .cartao { background: var(--cartao); border: 1px solid var(--linha); border-radius: 12px; padding: 12px 14px; margin-top: 12px; }
  h2 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--fraco); margin: 22px 0 0; }
  .rotulo { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--fraco); }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .kpi { background: var(--cartao); border: 1px solid var(--linha); border-radius: 10px; padding: 8px 10px; }
  .kpi b { display: block; font-size: 20px; font-weight: 700; }
  .kpi span { font-size: 11px; color: var(--suave); }
  .kpi.cvc { background: var(--cvc); color: var(--cvc-tinta); border-color: var(--cvc); }
  .kpi.cvc span { color: inherit; opacity: .8; }
  .marca { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; text-align: center; white-space: nowrap;
           background: var(--fundo); color: var(--suave); border: 1px solid var(--linha); }
    .linha-barra { display: grid; grid-template-columns: 82px 1fr 40px; align-items: center; gap: 8px; font-size: 12px; padding: 3px 0; }
  .linha-barra b { text-align: right; }
  .meses { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .mes { border: 1px solid var(--linha); border-radius: 8px; padding: 5px 8px; font-size: 11px; color: var(--suave); }
  .mes b { display: block; font-size: 12.5px; color: var(--tinta); }
  .mes.lido { border-color: var(--cvc-tinta); box-shadow: inset 0 0 0 1px var(--cvc-tinta); }
  .trecho .pos { width: 24px; color: var(--fraco); font-size: 11px; font-weight: 600; flex: none; }
  .trecho .marca { align-self: center; }
  .barra { height: 8px; border-radius: 4px; background: var(--barra); overflow: hidden; }
  .barra i { display: block; height: 100%; background: var(--outra); }
  .comp { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 8px; padding: 5px 0;
          border-top: 1px solid var(--linha); font-size: 12.5px; }
  .comp.m { grid-template-columns: 82px 1fr auto; }
  .comp:first-of-type { border-top: 0; }
  .comp .valor { text-align: right; font-weight: 600; white-space: nowrap; }
  .tag { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
  .tag.bom { color: var(--bom); background: var(--bom-f); } .tag.ruim { color: var(--ruim); background: var(--ruim-f); }
  button.kpi { font: inherit; text-align: left; margin: 0; cursor: pointer; }
  .kpi.clicavel:hover, .kpi.clicavel.ativo { box-shadow: 0 0 0 2px var(--cvc-tinta); }
  .link-pos { font: inherit; font-weight: 700; margin: 0; padding: 0 2px; border: 0; background: none; color: inherit;
              text-decoration: underline dotted; text-underline-offset: 3px; cursor: pointer; }
  .sem-borda { margin: 0; padding: 0; border: 0; background: none; cursor: pointer; }
  .kpis-2 { grid-template-columns: repeat(2, 1fr); margin-top: 0; }
  .tab { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
  .tab th { text-align: right; font-size: 10px; font-weight: 600; text-transform: uppercase; color: var(--fraco); padding: 4px 2px; }
  .tab th:first-child, .tab td:first-child { text-align: left; }
  .tab td { text-align: right; padding: 5px 2px; border-top: 1px solid var(--linha); white-space: nowrap; }
  .tab td.fraco { text-align: left; white-space: normal; }
  .tab tr.eh-cvc td { font-weight: 700; }
  .fechar { margin-top: 10px; }
  .kpi.sem-cvc { background: var(--ruim-f); color: var(--ruim); border-color: var(--ruim-f); }
  .kpi.sem-cvc span { color: inherit; opacity: .85; }
  .vend { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .vend .marca { min-width: 74px; }
  .vend .pos { width: 22px; color: var(--fraco); font-size: 11px; font-weight: 600; }
  .cvc-borda { border-color: var(--cvc); border-width: 2px; }
  .comp .valor.quebra { white-space: normal; max-width: 210px; }
  .comp .valor.fraco { color: var(--fraco); font-weight: 500; }
  .tag.abre { color: var(--suave); background: var(--fundo); border: 1px solid var(--linha); font-weight: 600; }
  .trecho { display: flex; gap: 8px; padding: 5px 0; border-top: 1px solid var(--linha); font-size: 12.5px; }
  .trecho:first-of-type { border-top: 0; padding-top: 0; }
  .trecho .p { font-weight: 700; margin-left: auto; white-space: nowrap; }
  .nota { font-size: 11px; margin-top: 6px; }
  .aviso { margin-top: 10px; padding: 8px 12px; border-radius: 10px; font-size: 12px; color: var(--alerta); background: var(--alerta-f); }
  .fraco { color: var(--fraco); } .suave { color: var(--suave); }
  button { font: inherit; margin-top: 8px; padding: 5px 12px; border-radius: 8px; cursor: pointer;
           border: 1px solid var(--linha); background: var(--cartao); color: var(--tinta); }
  button:disabled { opacity: .5; cursor: default; }
  .botoes { display: flex; gap: 8px; flex-wrap: wrap; }
  details { margin-top: 12px; background: var(--cartao); border: 1px solid var(--linha); border-radius: 12px; padding: 10px 14px; }
  summary { cursor: pointer; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--fraco); }
  .vazio { text-align: center; padding: 28px 8px; color: var(--suave); }
  .vazio img { width: 56px; height: 56px; }
  /* cor de cada marca: chip, barra e kpi */
  .marca.cvc { background: var(--cvc); color: var(--cvc-tinta); border-color: var(--cvc); } .barra i.cvc { background: var(--cvc); }
  .marca.rival { background: var(--rival); color: var(--rival-tinta); border-color: var(--rival); } .barra i.rival { background: var(--rival); }
  .marca.tiffany { background: var(--tiffany); color: var(--tiffany-tinta); border-color: var(--tiffany); } .barra i.tiffany { background: var(--tiffany); }
  .marca.maxmilhas { background: var(--maxmilhas); color: var(--maxmilhas-tinta); border-color: var(--maxmilhas); } .barra i.maxmilhas { background: var(--maxmilhas); }
  .marca.milhas123 { background: var(--milhas123); color: var(--milhas123-tinta); border-color: var(--milhas123); } .barra i.milhas123 { background: var(--milhas123); }
  .marca.gol { background: var(--gol); color: var(--gol-tinta); border-color: var(--gol); } .barra i.gol { background: var(--gol); }
  .marca.latam { background: var(--latam); color: var(--latam-tinta); border-color: var(--latam); } .barra i.latam { background: var(--latam); }
  .marca.azulcia { background: var(--azulcia); color: var(--azulcia-tinta); border-color: var(--azulcia); } .barra i.azulcia { background: var(--azulcia); }
</style>
</head>
<body>
<div id="app"><div class="vazio"><img src="icones/icone128.png" alt=""><p>Abra um post de promoção do Melhores Destinos<br>(melhoresdestinos.com.br/promocao/…) ou o “ver datas” de um trecho.</p></div></div>
<script src="catalogo.js"></script>
<script src="leitor.js"></script>
<script src="painel.js"></script>
</body>
</html>
