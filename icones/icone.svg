<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Identidade CVC: amarelo + azul-marinho (as mesmas cores dos cartoes da
       CVC no painel). Desenho proprio, sem o logotipo da marca. -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe600"/>
      <stop offset="1" stop-color="#ffd200"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#fundo)"/>
  <!-- lupa azul-marinho com lente clara -->
  <circle cx="54" cy="54" r="30" fill="#ffffff" stroke="#0b2a6f" stroke-width="10"/>
  <path d="M76 76 L103 103" stroke="#0b2a6f" stroke-width="15" stroke-linecap="round"/>
  <!-- aviao azul-marinho dentro da lente, subindo para a direita -->
  <g transform="translate(54 54) rotate(45) scale(1.02)">
    <path fill="#0b2a6f" d="M0-22c2.6 0 4 2 4 4.5V-6l17 9.5v5L4 3.5V13l5.5 4v4.5L0 19l-9.5 2.5V17l5.5-4V3.5l-17 5v-5L-4-6v-11.5C-4-20-2.6-22 0-22z"/>
  </g>
  <!-- selo de comparacao (barras de preco) - some no 16px -->
  <g id="selo">
    <circle cx="100" cy="30" r="17" fill="#0b2a6f" stroke="#ffe600" stroke-width="4"/>
    <rect x="91" y="30" width="5" height="9" rx="1.5" fill="#ffe600"/>
    <rect x="98" y="24" width="5" height="15" rx="1.5" fill="#ffffff"/>
    <rect x="105" y="20" width="5" height="19" rx="1.5" fill="#ffe600"/>
  </g>
</svg>
